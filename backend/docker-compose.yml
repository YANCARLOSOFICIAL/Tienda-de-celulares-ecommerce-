services:
  db:
    image: postgres:16-alpine
    container_name: tiendacell_db
    environment:
      POSTGRES_USER: tiendacell
      POSTGRES_PASSWORD: tiendacell
      POSTGRES_DB: tiendacell
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiendacell -d tiendacell"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: tiendacell_api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://tiendacell:tiendacell@db:5432/tiendacell
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python scripts/seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
